# Three copies of the backend behind an nginx load balancer, sharing one
# Redis for socket events, online status and rate limits. Layered on top of
# docker-compose.yml:
#
#   docker compose -f docker-compose.yml -f docker-compose.scale.yml up --build
#
# The app is still on http://localhost:8080, and the load balancer takes the
# backend's old place on http://localhost:5000.

services:
  redis:
    image: redis:8-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    # Replicas can't share a host port; the load balancer has it instead
    ports: !reset []
    environment:
      REDIS_URL: redis://redis:6379
    deploy:
      replicas: 3
    depends_on:
      redis:
        condition: service_healthy

  lb:
    image: nginx:1.29-alpine
    volumes:
      - ./deploy/nginx-lb.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "5000:80"
    depends_on:
      backend:
        condition: service_healthy
