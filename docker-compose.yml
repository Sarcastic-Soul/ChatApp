# The whole app on one machine: MongoDB, the API and socket server, and the
# built frontend behind nginx. Open http://localhost:8080.
#
#   docker compose up --build
#   docker compose exec backend node seed.js   # demo users, password123
#
# Secrets have local-only defaults. To use real Cloudinary or Groq keys, put
# them in a .env file next to this one (it is gitignored).

services:
  mongo:
    image: mongo:8.2
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGO_DB_URI: mongodb://mongo:27017/chatapp
      # "development" keeps the login cookie working over plain http
      NODE_ENV: development
      JWT_SECRET: ${JWT_SECRET:-local-docker-jwt-secret}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-local-docker-encryption-key}
      CLIENT_ORIGINS: http://localhost:8080
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      CLOUDFLARE_TURN_KEY_ID: ${CLOUDFLARE_TURN_KEY_ID:-}
      CLOUDFLARE_TURN_API_TOKEN: ${CLOUDFLARE_TURN_API_TOKEN:-}
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:5000
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mongo-data:
