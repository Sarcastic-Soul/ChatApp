# Render's free tier puts the backend to sleep after 15 minutes without
# traffic, and waking it takes 30 to 60 seconds. Pinging it every 10 minutes
# keeps it awake. GitHub can start scheduled runs a few minutes late.
name: Keep backend awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /healthz
        run: |
          curl --fail --silent --show-error \
            --max-time 90 --retry 3 --retry-delay 10 --retry-all-errors \
            https://socket-chat-w578.onrender.com/healthz
