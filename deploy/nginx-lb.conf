# Load balancer for docker-compose.scale.yml. "backend" resolves to every
# replica. With "resolve", nginx asks Docker's DNS (127.0.0.11) again every
# few seconds, so it picks up all replicas, including ones that start or
# restart after it.
resolver 127.0.0.11 valid=5s ipv6=off;

# Socket.IO starts most browsers on HTTP long-polling, and every polling
# request and the WebSocket upgrade must reach the server that opened the
# session. Those stick to one server by client IP. A client that opens a
# WebSocket straight away (no session id yet, like the k6 test) keeps one
# connection, so it can go to any server.
map "$arg_transport:$arg_sid" $socket_key {
    "websocket:" $request_id;
    default      $remote_addr;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

upstream sockets {
    zone sockets 64k;
    hash $socket_key consistent;
    server backend:5000 resolve;
}

upstream api {
    zone api 64k;
    server backend:5000 resolve;
}

server {
    listen 80;

    # Shows which replica answered, to check the load is spread
    add_header X-Upstream $upstream_addr always;

    location /socket.io/ {
        proxy_pass http://sockets;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
